name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install --upgrade pyinstaller pillow pystray

      - name: Build EXE
        shell: powershell
        run: |
          pyinstaller `
            --onefile `
            --noconsole `
            --icon assets\icon.ico `
            --add-data "assets\icon.png;assets" `
            --add-data "assets\icon.ico;assets" `
            --name PSVR2-SteamVR-Launcher `
            src\psvr2_steamvr.py

      - name: Assemble release package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release\installer | Out-Null
          Copy-Item dist\PSVR2-SteamVR-Launcher.exe release\
          Copy-Item Install.bat release\
          Copy-Item Uninstall.bat release\
          Copy-Item installer\Install.ps1 release\installer\
          Copy-Item installer\Uninstall.ps1 release\installer\
          Copy-Item README.md release\
          Copy-Item CHANGELOG.md release\
          Copy-Item LICENSE release\
          Compress-Archive -Path release\* -DestinationPath PSVR2-SteamVR-Launcher-${{ github.ref_name }}.zip -Force

      - name: Upload files to GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" `
            "PSVR2-SteamVR-Launcher-${{ github.ref_name }}.zip" `
            "dist/PSVR2-SteamVR-Launcher.exe" `
            --clobber
